name: Test and Lint
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install packages
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test code
        run: npm test
